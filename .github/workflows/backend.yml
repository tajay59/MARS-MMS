# Backend checks (TP "CI stages"): the shared library, each service, the service template,
# the Nginx gateway config and the local Compose stack with the services in it. On main,
# release.yml calls this before building images and deploying to staging.
name: backend

on:
  # Every pull request, with no path filter, so these can become required statuses
  # (a filtered-out run never reports and would block the PR).
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  mms-common:
    name: mms_common
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: libs/mms_common
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: libs/mms_common/pyproject.toml

      - run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: mypy
        run: mypy mms_common

      # Tests that need MongoDB, Redis or Kafka start throwaway containers on the stack's
      # pinned images; the runner has Docker.
      - name: Tests
        run: pytest -q

  service:
    name: ${{ matrix.service }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [auth, operations, media, report, platform]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            libs/mms_common/pyproject.toml
            services/${{ matrix.service }}/pyproject.toml

      # WeasyPrint draws with Pango; the runner image has it, this makes sure (report only).
      - name: Pango for WeasyPrint
        if: matrix.service == 'report'
        working-directory: .
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-inter

      - run: >-
          pip install -e ../../libs/mms_common -e ".[dev]"
          --config-settings editable_mode=compat

      - name: Ruff
        run: ruff check .

      - name: mypy
        run: mypy app

      # Unit, API (throwaway Mongo, Redis), contract, architecture and authorization-matrix
      # tests. Coverage target: 70% overall (TP); domain/ is checked in review.
      - name: Tests
        run: pytest -q --cov --cov-report=term --cov-fail-under=70

      # The frontend's API types come from frontend/openapi/<service>.json: it must match.
      - name: OpenAPI matches frontend/openapi
        if: contains(fromJSON('["auth", "operations", "media", "report", "platform"]'), matrix.service)
        working-directory: .
        run: |
          python infra/scripts/export_openapi.py ${{ matrix.service }}
          git diff --exit-code -- frontend/openapi

  service-template:
    name: service template
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            libs/mms_common/pyproject.toml
            templates/service/template/pyproject.toml.jinja

      - run: pip install copier -e libs/mms_common --config-settings editable_mode=compat

      # The IP exit criterion: a new service from the template passes every check unchanged,
      # both as an event producer and as a consumer only (like platform).
      - name: Generate, lint, type-check and test both variants
        run: |
          for events in true false; do
            dir="$RUNNER_TEMP/ci_demo_$events"
            copier copy --defaults --data service_name=ci_demo --data env_prefix=CIDEMO               --data produces_events=$events templates/service "$dir"
            (cd "$dir" && pip install -e ".[dev]" --config-settings editable_mode=compat               && ruff check . && mypy app && pytest -q)
          done

  gateway:
    name: nginx -t
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Test the gateway config
        run: |
          certs="$RUNNER_TEMP/certs"
          mkdir -p "$certs"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=ci \
            -keyout "$certs/tls.key" -out "$certs/tls.crt" 2> /dev/null
          docker run --rm \
            -e MMS_HOST=mms.example.org -e FILES_HOST=files.mms.example.org \
            -v "$PWD/infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/infra/nginx/snippets:/etc/nginx/snippets:ro" \
            -v "$PWD/infra/nginx/templates:/etc/nginx/templates:ro" \
            -v "$PWD/infra/nginx/office-ips.conf:/etc/nginx/office-ips.conf:ro" \
            -v "$certs:/etc/nginx/certs:ro" \
            --add-host seaweedfs:127.0.0.1 \
            nginx:1.31.7-alpine /docker-entrypoint.sh nginx -t

  stack:
    name: compose stack
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Nginx serves the SPA build; the stack tests check its headers and fallback.
      - name: Build the SPA
        working-directory: frontend
        run: npm ci && npm run build

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - run: pip install httpx pymongo redis boto3 pytest

      - name: Start the stack
        working-directory: infra
        run: |
          cp .env.example .env
          docker compose -f compose.yml -f compose.dev.yml up -d --build
          # Each one-shot init container must finish with 0. They wait for their store to be
          # healthy first, so once they are done Mongo, Kafka and SeaweedFS are ready.
          for svc in dev-certs dev-secrets mongo-init kafka-init seaweedfs-init; do
            cid="$(docker compose -f compose.yml -f compose.dev.yml ps -aq "$svc")"
            for _ in $(seq 1 120); do
              [ "$(docker inspect -f '{{.State.Status}}' "$cid")" = exited ] && break
              sleep 2
            done
            code="$(docker inspect -f '{{.State.ExitCode}}' "$cid")"
            echo "$svc exited with $code"
            [ "$code" = 0 ]
          done
          # Then the application services must report healthy.
          for svc in auth operations media report platform; do
            for _ in $(seq 1 60); do
              cid="$(docker compose -f compose.yml -f compose.dev.yml ps -q "$svc")"
              [ "$(docker inspect -f '{{.State.Health.Status}}' "$cid")" = healthy ] && break
              sleep 2
            done
            docker inspect -f "$svc {{.State.Health.Status}}" "$cid"
            [ "$(docker inspect -f '{{.State.Health.Status}}' "$cid")" = healthy ]
          done

      - name: Stack tests
        working-directory: infra
        run: pytest tests -q -rs -W ignore::urllib3.exceptions.InsecureRequestWarning

      # Journeys in a real browser through the stack (TP "End-to-end"): J1, J2, the offline shell.
      - name: Playwright journeys
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e -- --project=chromium

      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

      - name: Logs on failure
        if: failure()
        working-directory: infra
        run: docker compose -f compose.yml -f compose.dev.yml logs --no-color --tail 100

      - name: Stop the stack
        if: always()
        working-directory: infra
        run: docker compose -f compose.yml -f compose.dev.yml down -v
