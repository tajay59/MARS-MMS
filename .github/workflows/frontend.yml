# Frontend checks: lint, unit tests, API type drift, type-check and build (TP "CI stages"). On main, release.yml calls this before
# building images and deploying to staging.
name: frontend

on:
  # Every pull request runs it, with no path filter: `check` is a required
  # status on main, and a filtered-out run would never report and block the PR.
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # The API types must be generated from the committed schema (openapi/*.json); the
      # backend job checks that the schema matches the service.
      - name: API types match openapi/
        run: |
          npm run api:types
          git diff --exit-code -- src/api/types

      # build runs vue-tsc (type-check) and the Vite production build in parallel
      - name: Type-check and build
        run: npm run build

      # The kill switch (W15-3) must keep building: a self-destroying worker, and an app that does
      # not register it again. Nothing from this build is deployed by a release.
      - name: Kill-switch build
        run: |
          npm run build:kill
          grep -q "registration.unregister" dist-kill/sw.js
          ! grep -q "workbox" dist-kill/sw.js
