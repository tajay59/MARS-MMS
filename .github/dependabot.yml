# Version updates (W20 slice 5, TRD §15): one pull request a week per ecosystem, grouped, so a
# review is one change and not forty. Security updates are separate and immediate (Dependabot
# alerts are on in the repository).
#
# Major versions of the data stores and the base images are never proposed here: MongoDB, Kafka,
# Redis, SeaweedFS and Python move by decision (an ADR and a restore test), not by a bot. Pins that
# exist for a reason say so where they are (for example pypdfium2 in services/report/visual).
version: 2

updates:
  - package-ecosystem: pip
    directories:
      - /libs/mms_common
      - /services/*
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # A floor in pyproject.toml is only raised when the new release no longer fits it: CI and the
    # images install the newest release anyway, so a raised floor changes nothing at run time
    # (W21: 21 such pull requests came in one week).
    versioning-strategy: increase-if-necessary
    # group-by makes one pull request per dependency across all the directories, not one per
    # service. Major versions are their own group so a review of a major is never mixed with
    # patches.
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]
        group-by: dependency-name
      python-major:
        patterns: ["*"]
        update-types: [major]
        group-by: dependency-name
    labels: [dependencies]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      frontend:
        patterns: ["*"]
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: docker
    directories:
      - /services/*
      - /infra/nginx
      - /infra/backup
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      images:
        patterns: ["*"]
        group-by: dependency-name
    labels: [dependencies]

  - package-ecosystem: docker-compose
    directory: /infra
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      stack:
        patterns: ["*"]
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies]
