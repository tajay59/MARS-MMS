# MARS-MMS staging (decision W4-8) on the shared server's edge Nginx (container printit-nginx,
# which loads /srv/edge-sites/*.conf). Not part of the MMS stack and not copied by the deploy:
# install it by hand, as root on the server, after a change here:
#
#   cp /opt/mms/infra/nginx/staging-edge.conf /srv/edge-sites/mms-staging.conf
#   docker exec printit-nginx nginx -t && docker exec printit-nginx nginx -s reload
#
# Certificate: /etc/letsencrypt/live/rnd.yanacreations.com, both names, from the server's
# certbot. It renews the way the server's other certificates do (standalone, with the hooks
# that stop and start printit-nginx).
#
# The edge only terminates TLS and passes requests through unbuffered. MMS's own Nginx
# (alias mms-gateway on kong-net) sets the headers, CSP, cache rules, body limits and rate
# limits, so nothing here adds a header.

map $http_upgrade $mms_edge_connection {
  default upgrade;
  "" "";
}

server {
  listen 80;
  server_name rnd.yanacreations.com files.yanacreations.com;

  location ^~ /.well-known/acme-challenge/ {
    root /etc/nginx/sites/acme;
    default_type text/plain;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name rnd.yanacreations.com files.yanacreations.com;

  ssl_certificate /etc/letsencrypt/live/rnd.yanacreations.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/rnd.yanacreations.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  # MMS enforces 10m on the app host and 16m on the files host (8 MiB parts plus headroom).
  client_max_body_size 16m;

  location / {
    set $mms_gateway mms-gateway:443;
    proxy_pass https://$mms_gateway;
    # MMS picks the server by name; its certificate is self-signed, on this same server.
    proxy_ssl_server_name on;
    proxy_ssl_name $host;
    proxy_ssl_verify off;
    proxy_http_version 1.1;
    # Presigned URLs are signed over the host, so pass it exactly as the browser sent it.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $mms_edge_connection;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_send_timeout 300s;
    proxy_read_timeout 1h;  # the WebSocket at /ws (Phase 3); everything else answers sooner
  }
}
