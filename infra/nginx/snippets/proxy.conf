# Pass the path unchanged to the service named in $mms_upstream (TRD §2.1).
# A variable in proxy_pass makes nginx resolve the name per request (see `resolver`).
proxy_pass http://$mms_upstream;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Request-ID $mms_request_id;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header Connection "";

# Services answer problem+json themselves; these cover a service that is down or not built.
proxy_intercept_errors off;
error_page 502 503 504 = @mms_unavailable;
