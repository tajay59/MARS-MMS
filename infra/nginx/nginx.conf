# AWS-MMS edge and gateway (TRD §2.1, §15, ADR-5). Host names come from the environment
# through templates/*.conf.template, which the image renders into conf.d/ at start.
# Nginx does not verify JWTs; every service does (ADR-7).

user nginx;
worker_processes auto;
pid /run/nginx.pid;

events {
  worker_connections 2048;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  types {
    application/manifest+json webmanifest;
  }

  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  # Docker's DNS. Upstreams are resolved per request, so the gateway starts (and answers
  # 502 for that route) while a service is down or not built yet.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  # The client's address when another proxy sits in front (staging); before the rate limits.
  include /etc/nginx/snippets/real-ip.conf;

  # Request ID: keep a well-formed incoming X-Request-ID, otherwise generate one.
  map $http_x_request_id $mms_request_id {
    "~^[A-Za-z0-9._-]{1,64}$" $http_x_request_id;
    default $request_id;
  }

  log_format mms_json escape=json
    '{"time":"$time_iso8601","request_id":"$mms_request_id","remote":"$remote_addr",'
    '"host":"$host","method":"$request_method","uri":"$uri","status":$status,'
    '"bytes":$body_bytes_sent,"request_time":$request_time,'
    '"upstream":"$upstream_addr","upstream_time":"$upstream_response_time",'
    '"user_agent":"$http_user_agent"}';
  access_log /dev/stdout mms_json;
  error_log /dev/stderr warn;

  # Rate limits (TRD §2.1). Office IPs (many staff behind one NAT) get a higher api limit.
  geo $mms_office {
    default 0;
    include /etc/nginx/office-ips.conf;
  }
  map $mms_office $mms_api_key {
    0 $binary_remote_addr;
    1 "";
  }
  map $mms_office $mms_office_key {
    0 "";
    1 $binary_remote_addr;
  }
  limit_req_zone $mms_api_key zone=api:10m rate=300r/m;
  limit_req_zone $mms_office_key zone=api_office:10m rate=3000r/m;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
  limit_req_status 429;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
  }

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

  include /etc/nginx/conf.d/*.conf;
}
