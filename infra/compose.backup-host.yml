# What the backup host runs (W20-7): a second SeaweedFS that `filer-sync` fills. Used on its own
# on the backup host, and with compose.yml + compose.backup.yml locally and in CI, where it stands
# in for that host:
#
#   docker compose -f compose.yml -f compose.dev.yml -f compose.backup.yml -f compose.backup-host.yml up -d
#
# It uses the primary's S3 identities (same environment), so `backup` can read both with one key.

services:
  seaweedfs-replica:
    restart: unless-stopped
    image: chrislusf/seaweedfs:4.48
    entrypoint: ["/bin/sh", "/opt/mms/seaweedfs-entrypoint.sh"]
    environment:
      APP_ORIGIN: https://${MMS_HOST}
      MEDIA_S3_ACCESS_KEY: ${MEDIA_S3_ACCESS_KEY:?}
      MEDIA_S3_SECRET_KEY: ${MEDIA_S3_SECRET_KEY:?}
      REPORT_S3_ACCESS_KEY: ${REPORT_S3_ACCESS_KEY:?}
      REPORT_S3_SECRET_KEY: ${REPORT_S3_SECRET_KEY:?}
      ADMIN_S3_ACCESS_KEY: ${ADMIN_S3_ACCESS_KEY:?}
      ADMIN_S3_SECRET_KEY: ${ADMIN_S3_SECRET_KEY:?}
    volumes:
      - ./seaweedfs/seaweedfs-entrypoint.sh:/opt/mms/seaweedfs-entrypoint.sh:ro
      - ./seaweedfs/s3.template.json:/opt/mms/s3.template.json:ro
      - seaweedfs-replica-data:/data
    mem_limit: 512m
    networks: [backend]

volumes:
  seaweedfs-replica-data:
