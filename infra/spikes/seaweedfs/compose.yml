# Phase 0 SeaweedFS spike (IP Phase 0, TRD §10, risk R6). Throwaway: not part of the app stack.
#
#   docker compose up -d --build
#   docker compose run --rm spike python check.py      # server-side checks
#   open http://localhost:8080                         # browser upload through the files host
#   docker compose down -v                             # remove everything, including stored data
#
# Two origins, as in production: the "app" at http://localhost:8080 and the
# files host at http://files.localhost:8080, both served by Nginx.

name: mms-spike-seaweedfs

services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command:
      - server
      - -dir=/data
      - -master.volumeSizeLimitMB=1024
      - -s3
      - -s3.config=/etc/seaweedfs/s3.json
      - -s3.allowedOrigins=http://localhost:8080
    volumes:
      - ./s3.json:/etc/seaweedfs/s3.json:ro
      - seaweedfs-data:/data

  nginx:
    image: nginx:1.31.7-alpine
    depends_on: [seaweedfs, spike]
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      default:
        # Lets the spike container reach the files host by the same name the browser uses,
        # so presigned URLs signed for files.localhost:8080 work from both.
        aliases: [files.localhost]

  spike:
    build: ./app
    depends_on: [seaweedfs]
    environment:
      S3_INTERNAL_URL: http://seaweedfs:8333
      S3_FILES_URL: http://files.localhost:8080
      APP_ORIGIN: http://localhost:8080
      S3_ACCESS_KEY: spike-access-key
      S3_SECRET_KEY: spike-secret-key-not-for-production

volumes:
  seaweedfs-data:
