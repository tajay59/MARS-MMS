# The files host: a plain pass-through to the SeaweedFS S3 gateway, as in production.
# Nginx adds no CORS headers here; the spike checks that SeaweedFS sends them itself.
# Phone mode (compose.phone.yml) reaches it as <LAN_IP>.sslip.io, a public DNS name that resolves to
# the PC's LAN address: a different host from the page's http://<LAN_IP>:8080, so still cross-origin,
# on the one port the PC's firewall already lets in.
server {
    listen 8080;
    server_name files.localhost ~\.sslip\.io$;

    client_max_body_size 16m;        # as in production (TRD §2.1): one 8 MiB part per request
    proxy_request_buffering off;     # stream uploads straight through
    proxy_buffering off;

    location / {
        proxy_pass http://seaweedfs:8333;
        proxy_http_version 1.1;
        # Presigned URLs sign the Host header, so pass it through unchanged (with the port).
        proxy_set_header Host $http_host;
    }
}

# The "app" origin: serves the upload page and the presign API.
server {
    listen 8080 default_server;
    server_name localhost;

    location / {
        proxy_pass http://spike:8000;
        proxy_set_header Host $http_host;
    }
}
