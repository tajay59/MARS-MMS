[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mms-common"
version = "0.1.0"
description = "Shared library for the AWS-MMS services (TRD §19)"
requires-python = ">=3.13"
dependencies = [
  "pydantic>=2.11",
  "pymongo>=4.13",
  "redis>=6",
  "aiokafka",
  "structlog",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "hypothesis", "ruff", "mypy", "testcontainers[mongodb,redis]"]

[tool.setuptools.packages.find]
include = ["mms_common*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["req(id): requirement ID from the PRD that the test covers (docs/TP.md)"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S603", "S607"]

[tool.mypy]
python_version = "3.13"
strict = true
